name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERILATOR_VERSION: v5.052            # cocotb 2.x needs >= 5.036; Ubuntu 24.04 ships 5.020
      VERILATOR_PREFIX: /home/runner/verilator
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make g++ autoconf flex bison libfl-dev help2man perl zlib1g-dev ccache \
            python3 python3-venv python3-dev iverilog

      - name: Restore Verilator ${{ env.VERILATOR_VERSION }}
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: /home/runner/verilator
          key: verilator-${{ env.VERILATOR_VERSION }}-ubuntu-24.04-v1

      - name: Build Verilator ${{ env.VERILATOR_VERSION }} (cache miss only)
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$VERILATOR_VERSION" https://github.com/verilator/verilator /tmp/verilator
          cd /tmp/verilator
          autoconf
          ./configure --prefix="$VERILATOR_PREFIX"
          make -j"$(nproc)"
          make install

      - name: Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Lint (verilator -Wall)
        run: make lint VERILATOR_BIN_DIR="$VERILATOR_PREFIX/bin"

      - name: Test (cocotb + Verilator)
        run: make test VERILATOR_BIN_DIR="$VERILATOR_PREFIX/bin"

      - name: Test (cocotb + Icarus Verilog)
        run: make test-icarus

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-logs
          path: |
            build/*.log
            build/**/results.xml
          if-no-files-found: ignore
